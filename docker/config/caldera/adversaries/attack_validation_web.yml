id: adv-attack-validation-web-001
name: '[V] ATT&CK Validation — Web'
description: >-
  S2 재작성 검증 프로파일. 공격자 측 verdict(결정1)를 산출하는 4종 ability 를 한 번에 실행한다.
  탐지 커버리지: T1190×3 (SQLi 100210 / Path Traversal 100220 / SSRF 100240) + T1110 (Brute Force 100230~100233).
  각 ability 는 응답을 파싱해 <scenario>.verdict / <scenario>.evidence.kind fact 를 남기며,
  이를 webapp 측 ground-truth(Validator)와 대조해 탐지 정확도를 측정한다.
