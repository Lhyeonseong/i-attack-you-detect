id: adv-owasp-rce-001
name: '[H] OWASP Extended - RCE Command Injection'
description: OWASP A03(Injection) Command Injection 전용 프로파일. 기본 메타문자 삽입(;, |, &&) 으로 RCE를 시도한 뒤, 출력이 차단된 환경에서 시간 기반 Blind 기법으로 확인하고, 마지막으로 $IFS, hex 인코딩, 와일드카드 등 고급 필터 우회 기법을 테스트한다.
