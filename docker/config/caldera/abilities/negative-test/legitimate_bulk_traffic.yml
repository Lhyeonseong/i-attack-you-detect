                   "meeting-minutes-oct.pdf" "meeting-minutes-nov.pdf" "meeting-minutes-dec.pdf"
                   "project-plan-alpha.pdf" "project-plan-beta.pdf" "project-plan-gamma.pdf"
                   "project-plan-delta.pdf" "project-plan-epsilon.pdf"
                   "newsletter-jan.pdf" "newsletter-feb.pdf" "newsletter-mar.pdf"
                   "newsletter-apr.pdf" "newsletter-may.pdf" "newsletter-jun.pdf"
                   "newsletter-jul.pdf" "newsletter-aug.pdf" "newsletter-sep.pdf"
                   "newsletter-oct.pdf" "newsletter-nov.pdf" "newsletter-dec.pdf"
                   "press-release-2026.pdf")

          FILES_4=("logo-primary.png" "logo-secondary.png" "logo-icon.png"
                   "banner-homepage.jpg" "banner-sale.jpg" "banner-event.jpg"
                   "photo-team.jpg" "photo-office.jpg" "photo-product.jpg"
                   "diagram-architecture.png" "diagram-workflow.png" "diagram-network.png"
                   "chart-revenue.png" "chart-growth.png" "chart-market.png"
                   "template-invoice.docx" "template-contract.docx" "template-proposal.docx"
                   "template-report.docx" "template-letter.docx"
                   "slides-intro.pptx" "slides-quarterly.pptx" "slides-strategy.pptx"
                   "spreadsheet-budget.xlsx" "spreadsheet-inventory.xlsx"
                   "backup-config.json" "settings-default.json" "schema-v1.json"
                   "data-sample.csv" "export-2026.csv")

          echo "  [2/3] Download requests (120건 = 4 rounds × 30 files)"
          DL_COUNT=0
          for ROUND_FILES in FILES_1 FILES_2 FILES_3 FILES_4; do
            eval 'FILE_ARRAY=("${'"$ROUND_FILES"'[@]}")'
            for f in "${FILE_ARRAY[@]}"; do
              curl -s -o /dev/null \
                -H "X-Caldera-Op-Id: ${OP_ID}" \
                -H "X-Caldera-Technique: ${TECH_ID}" \
                -H "X-Caldera-Ability: ${ABILITY_ID}" \
                -A "Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}" \
                "${TARGET}/api/files/download?filename=${f}"
              DL_COUNT=$((DL_COUNT + 1))
            done
          done
          echo "    Done: ${DL_COUNT} download requests sent."

          ##################################################################
          # [3/3] Login requests — 80건
          # 80개의 정상 사용자명 (고유한 이름으로 credential stuffing 패턴 회피)
          ##################################################################
          USERS=("alice" "bob" "charlie" "dave" "eve" "frank" "grace" "heidi" "ivan" "judy"
                 "kevin" "linda" "mike" "nancy" "oscar" "peggy" "quinn" "rachel" "steve" "tina"
                 "ursula" "victor" "wendy" "xavier" "yolanda" "zach" "aaron" "beth" "carl" "diana"
                 "ethan" "fiona" "george" "hannah" "isaac" "julia" "kyle" "laura" "mason" "nina"
                 "oliver" "paula" "quentin" "rosa" "samuel" "teresa" "ulrich" "valerie" "walter" "xena"
                 "yvonne" "zane" "albert" "brenda" "curtis" "denise" "edgar" "faith" "glenn" "helen"
                 "irene" "james" "kathy" "leon" "megan" "nolan" "ophelia" "peter" "queenie" "roger"
                 "susan" "thomas" "uma" "vince" "wanda" "xander" "yuri" "zelda" "adam" "bella")

          echo "  [3/3] Login requests (80건)"
          LOGIN_COUNT=0
          for u in "${USERS[@]}"; do
