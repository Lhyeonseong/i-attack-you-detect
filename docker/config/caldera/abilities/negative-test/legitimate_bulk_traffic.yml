                   "product-catalog-2026.pdf" "price-list-2026.pdf" "shipping-rates.pdf"
                   "return-policy.pdf" "size-chart.pdf"
                   "user-manual-v1.pdf" "user-manual-v2.pdf" "user-manual-v3.pdf"
