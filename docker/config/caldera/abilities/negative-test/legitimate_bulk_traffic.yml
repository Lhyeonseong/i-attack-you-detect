                      "april" "may" "june" "july" "august" "september" "october" "november"
                      "december" "morning" "afternoon" "evening" "midnight" "sunrise" "sunset"
                      "rainbow" "thunder" "lightning" "breeze" "storm" "cloud" "mountain"
                      "river" "ocean" "forest" "desert" "island" "valley" "canyon" "plateau"
                      "meadow" "glacier" "volcano" "waterfall" "lagoon" "peninsula")

          echo "  [1/3] Search requests (300건 = 6 rounds × 50 keywords)"
          SEARCH_COUNT=0
          for ROUND_KEYWORDS in KEYWORDS_1 KEYWORDS_2 KEYWORDS_3 KEYWORDS_4 KEYWORDS_5 KEYWORDS_6; do
            eval 'KW_ARRAY=("${'"$ROUND_KEYWORDS"'[@]}")'
            for kw in "${KW_ARRAY[@]}"; do
              curl -s -o /dev/null \
                -H "X-Caldera-Op-Id: ${OP_ID}" \
                -H "X-Caldera-Technique: ${TECH_ID}" \
                -H "X-Caldera-Ability: ${ABILITY_ID}" \
                -A "Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}" \
                "${TARGET}/api/products/search?keyword=${kw}"
              SEARCH_COUNT=$((SEARCH_COUNT + 1))
            done
          done
          echo "    Done: ${SEARCH_COUNT} search requests sent."

          ##################################################################
          # [2/3] Download requests — 120건
          # 120개의 정상 파일명 (4 라운드 × 30개)
          ##################################################################
          FILES_1=("brochure.pdf" "manual.pdf" "spec.pdf" "guide.pdf" "faq.pdf"
