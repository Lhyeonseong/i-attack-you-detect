                      "avocado" "tomato" "potato" "onion" "garlic" "pepper" "carrot" "corn"
                      "rice" "bread" "pasta" "cheese" "butter" "milk" "yogurt" "cream"
                      "sugar" "salt" "honey" "oil" "vinegar" "sauce" "soup" "salad"
                      "chicken" "beef" "pork" "fish" "shrimp" "egg" "tofu" "mushroom"
                      "broccoli" "spinach")

          KEYWORDS_4=("soccer" "tennis" "baseball" "basketball" "golf" "swimming" "running"
                      "cycling" "boxing" "yoga" "hiking" "camping" "fishing" "surfing" "skiing"
                      "snowboard" "skating" "climbing" "diving" "sailing" "rowing" "archery"
                      "fencing" "judo" "karate" "taekwondo" "wrestling" "weightlifting" "dance"
                      "ballet" "piano" "guitar" "violin" "drums" "flute" "trumpet" "cello"
                      "painting" "drawing" "pottery" "knitting" "sewing" "cooking" "baking"
                      "gardening" "reading" "writing" "chess" "puzzle")

          KEYWORDS_5=("algebra" "geometry" "calculus" "physics" "chemistry" "biology" "history"
                      "geography" "literature" "grammar" "philosophy" "psychology" "economics"
                      "sociology" "politics" "music" "theater" "cinema" "sculpture" "design"
                      "engineering" "medicine" "nursing" "pharmacy" "dentistry" "veterinary"
                      "architecture" "accounting" "marketing" "finance" "management" "logistics"
