                   "overview.pdf" "datasheet.pdf" "whitepaper.pdf" "readme.txt" "changelog.txt"
                   "license.txt" "notice.txt" "credits.txt" "authors.txt" "contributors.txt"
                   "roadmap.md" "release.md" "install.md" "upgrade.md" "quickstart.md")

          FILES_2=("annual-report-2025.pdf" "annual-report-2024.pdf" "annual-report-2023.pdf"
