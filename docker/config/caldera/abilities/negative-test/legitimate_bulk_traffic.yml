              -H "X-Caldera-Op-Id: ${OP_ID}" \
              -H "X-Caldera-Technique: ${TECH_ID}" \
              -H "X-Caldera-Ability: ${ABILITY_ID}" \
              -A "Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}" \
              -H "Content-Type: application/json" \
              -X POST -d "{\"username\":\"${u}\",\"password\":\"CorrectPass123\"}" \
              "${TARGET}/api/auth/login"
            LOGIN_COUNT=$((LOGIN_COUNT + 1))
          done
          echo "    Done: ${LOGIN_COUNT} login requests sent."

          TOTAL=$((SEARCH_COUNT + DL_COUNT + LOGIN_COUNT))
