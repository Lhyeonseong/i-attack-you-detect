                      "keyboard" "mouse" "speaker" "camera" "printer" "scanner" "router"
                      "modem" "switch" "hub" "adapter" "battery" "case" "stand" "mount"
                      "light" "microphone" "webcam" "desk" "chair" "shelf" "rack" "tray"
                      "tape" "glue" "pen" "pencil" "paper" "notebook" "folder" "binder"
                      "stapler" "scissors" "ruler" "eraser" "marker" "highlighter" "clip"
                      "pin" "rubber" "cord" "wire" "tool")

          KEYWORDS_2=("shirt" "pants" "jacket" "shoes" "socks" "hat" "scarf" "gloves"
                      "belt" "watch" "ring" "necklace" "bracelet" "earring" "sunglasses"
                      "backpack" "wallet" "purse" "umbrella" "towel" "blanket" "pillow"
                      "cup" "plate" "bowl" "fork" "spoon" "knife" "pot" "pan"
                      "oven" "fridge" "washer" "dryer" "vacuum" "iron" "blender" "toaster"
                      "kettle" "lamp" "fan" "heater" "clock" "mirror" "curtain" "rug"
                      "vase" "frame" "basket" "candle")

