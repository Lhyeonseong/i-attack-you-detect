- id: 99a0b1c2-3d4e-4567-f890-abcdef000004
  name: Legitimate Bulk Traffic
  description: 대량의 정상 트래픽(검색 300건 + 다운로드 120건 + 로그인 80건 = 500건)을 발생시켜 FP rate를 통계적으로 측정합니다. 500건 기준 FP 0건이면 95% 신뢰구간에서 FP rate < 0.6%.
  tactic: negative-test
  technique:
    attack_id: auto-generated
    name: Negative Test - False Positive Rate Measurement
  platforms:
    linux:
      sh:
        command: |-
          OP_ID="#{operation_id}"
          TECH_ID="T0000"
          ABILITY_ID="99a0b1c2-3d4e-4567-f890-abcdef000004"
          TARGET="http://#{target.url}"

          echo "[*] Negative Test: Bulk legitimate traffic (500 requests)"
          echo "[*] Generating 300 search + 120 download + 80 login = 500 requests"
          echo "[*] Statistical basis: 500 requests with 0 FP → 95% CI FP rate < 0.6%"

          ##################################################################
          # [1/3] Search requests — 300건
