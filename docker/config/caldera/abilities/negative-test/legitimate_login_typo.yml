- id: 99a0b1c2-3d4e-4567-f890-abcdef000003
  name: Legitimate Login with Typo
  description: 정상 사용자가 비밀번호를 1~2회 실수한 후 올바른 비밀번호로 로그인합니다. Brute Force threshold 룰이 오탐하지 않는지 검증합니다.
  tactic: negative-test
  technique:
    attack_id: auto-generated
    name: Negative Test - False Positive Verification
  platforms:
    linux:
      sh:
        command: |-
          OP_ID="#{operation_id}"
          TECH_ID="T0000"
          ABILITY_ID="99a0b1c2-3d4e-4567-f890-abcdef000003"
          TARGET="http://#{target.url}"

          echo "[*] Negative Test: Login with password typo"

          echo "[1] First attempt (wrong password)"
          curl -s -o /dev/null -w "HTTP=%{http_code}\n" \
            -H "X-Caldera-Op-Id: ${OP_ID}" \
            -H "X-Caldera-Technique: ${TECH_ID}" \
            -H "X-Caldera-Ability: ${ABILITY_ID}" \
            -A "Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}" \
            -H "Content-Type: application/json" \
            -X POST -d '{"username":"alice","password":"MyP@ssw0rd!_typo"}' \
            "${TARGET}/api/auth/login"

          echo "[2] Second attempt (wrong password)"
          curl -s -o /dev/null -w "HTTP=%{http_code}\n" \
            -H "X-Caldera-Op-Id: ${OP_ID}" \
            -H "X-Caldera-Technique: ${TECH_ID}" \
            -H "X-Caldera-Ability: ${ABILITY_ID}" \
            -A "Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}" \
            -H "Content-Type: application/json" \
            -X POST -d '{"username":"alice","password":"MyP@ssw0rd_typo2"}' \
            "${TARGET}/api/auth/login"

          echo "[3] Third attempt (correct password)"
          curl -s -o /dev/null -w "HTTP=%{http_code}\n" \
            -H "X-Caldera-Op-Id: ${OP_ID}" \
            -H "X-Caldera-Technique: ${TECH_ID}" \
            -H "X-Caldera-Ability: ${ABILITY_ID}" \
            -A "Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}" \
            -H "Content-Type: application/json" \
            -X POST -d '{"username":"alice","password":"MyP@ssw0rd!"}' \
            "${TARGET}/api/auth/login"
