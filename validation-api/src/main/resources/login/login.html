<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — ATT&amp;CK Validator</title>
<link rel="stylesheet" href="/login/login.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brow">
      <span class="bm" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 2 12l10 10 10-10z"/><path d="M12 7 7 12l5 5 5-5z" fill="currentColor"/></svg>
      </span>
      <span><strong>ATT&amp;CK VALIDATOR</strong><small>CONTINUOUS SECURITY</small></span>
    </div>
    <div class="tagline">MITRE ATT&amp;CK 기반 보안 검증 플랫폼</div>
  </div>

  <form class="card" id="loginForm" method="post" action="/login" novalidate>
    <h1>로그인</h1>
    <p>검증 결과 열람 계정으로 로그인하세요.</p>

    <div class="err __NOTICE_CLASS__" id="err" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="err-icon"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span id="errMsg">__NOTICE_MESSAGE__</span>
    </div>

    <div class="fld">
      <label for="uid">아이디</label>
      <input id="uid" name="username" class="inp" type="text" autocomplete="username" placeholder="아이디">
    </div>
    <div class="fld">
      <label for="upw">비밀번호</label>
      <div class="pw">
        <input id="upw" name="password" class="inp" type="password" autocomplete="current-password" placeholder="비밀번호">
        <button type="button" class="eye" id="eye" aria-label="비밀번호 보기" aria-pressed="false">
          <svg id="eyeOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
    </div>
    <input type="hidden" name="_csrf" value="__CSRF__">
    <button type="submit" class="btn">로그인</button>
    <p class="lock">로그인 5회 실패 시 15분간 잠깁니다.</p>

    <div class="foot">계정은 관리자가 발급합니다. 로그인 후에는 검증 결과를 조회만 할 수 있습니다.</div>
  </form>
</div>

<script src="/login/login.js" defer></script>
</body>
</html>
